# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Type checks and frontend lint run with the project's own toolchains.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c "cd backend && python -m mypy app --config-file pyproject.toml"
        language: system
        files: ^backend/app/.*\.py$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        entry: bash -c "cd frontend && npx eslint . --max-warnings 0"
        language: system
        files: ^frontend/.*\.(ts|tsx|mjs)$
        pass_filenames: false
      - id: tsc
        name: tsc (frontend)
        entry: bash -c "cd frontend && npx tsc --noEmit"
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
