[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivaiq-backend"
version = "0.1.0"
description = "VivaIQ Backend - AI Voice Viva Examiner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "librosa>=0.10.2",
    "soundfile>=0.12.1",
    "google-genai>=0.1.1",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
