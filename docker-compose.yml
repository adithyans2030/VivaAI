version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements.txt
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=testing
      - DEBUG=false
      - DEMO_MODE=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/vivaiq.db
      - LLM_PROVIDER=mock
      - STT_PROVIDER=mock
      - TTS_PROVIDER=browser
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./backend:/app
    restart: unless-stopped

  backend-gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        REQUIREMENTS_FILE: requirements-ml.txt
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=false
      - DEMO_MODE=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/vivaiq.db
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - STT_PROVIDER=whisper
      - WHISPER_MODEL_SIZE=base.en
      - WHISPER_DEVICE=cuda
      - TTS_PROVIDER=browser
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./backend:/app
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/ws
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - gpu
      - local-llm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  ollama_data:
