server {
  listen 3000;
  root /usr/share/nginx/html;

  # Hashed build assets never change; cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/teacher/sessions/<id>, …) all load the single-page app.
  location / {
    try_files $uri /index.html;
  }
}
